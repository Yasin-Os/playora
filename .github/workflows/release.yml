name: Release

# Publishes a GitHub release whenever a version tag (v*) is pushed.
# Example: tag v0.1.0 on main -> release "Playora v0.1.0" with the debug APK.
#
# This is a debug build, not release-signed. A signed release needs a
# release keystore + GitHub secrets (planned for v1.0 — see docs/ROADMAP.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step: ubuntu-latest runners already ship a full
      # Android SDK. setup-android v3 fails on the obsolete "tools" package.

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Playora-${{ github.ref_name }}-debug.apk"
          gh release create "${{ github.ref_name }}" "Playora-${{ github.ref_name }}-debug.apk" \
            --title "Playora ${{ github.ref_name }}" \
            --prerelease \
            --notes "First test build (pre-release) of Playora — a modern media player for Android.

          What's inside (v0.1.0 skeleton):
          - Bottom navigation: Video / Music / Photos
          - Media3 ExoPlayer player foundation
          - MediaStore browser for device videos, music and photos
          - Photo editor basics (rotate, flip, crop, brightness, contrast)
          - Material 3 theme + launcher icon

          This is a debug build, not release-signed yet. Install it to try the app shell — playback and browsing features land in Phase 1. Full plan: docs/ROADMAP.md"
